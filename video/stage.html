<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Secure GPU Stack walkthrough</title>
<style>
:root {
  --bg: #080B10;
  --ink: #EAF0F5;
  --soft: #C3CDD8;
  --mute: #8794A5;
  --dim: #4A5666;
  --edge: #223042;
  --line: #18212D;
  --pass: #3DDC97;
  --warn: #FFB020;
  --bad: #FF5D5D;
  --info: #5CC8FF;
  --violet: #A991FF;
  --sans: system-ui, "SF Pro Display", "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --cond: "Avenir Next Condensed", "Avenir Next", system-ui, sans-serif;
  --serif: ui-serif, "New York", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
#bg { position: absolute; inset: 0; background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1.2px, transparent 0); background-size: 34px 34px; }
#vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.55) 100%); }
#glow { position: absolute; width: 1600px; height: 1600px; border-radius: 50%; }
#stage { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; }
.scene > * { position: absolute; }

#hud { position: absolute; left: 120px; right: 120px; top: 52px; height: 30px; display: flex; justify-content: space-between; align-items: center; }
#hud .wm { display: flex; align-items: center; gap: 14px; font: 700 17px/1 var(--sans); letter-spacing: .26em; color: var(--soft); }
#hud .ch { font: 600 17px/1 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--soft); }
#hud .ch b { font: 700 17px/1 var(--mono); color: var(--pass); letter-spacing: .06em; margin-right: 14px; }
#cap { position: absolute; left: 0; right: 0; bottom: 58px; display: flex; justify-content: center; }
#cap span { max-width: 1520px; text-align: center; font: 600 31px/1.36 var(--sans); color: #F4F7FA; background: rgba(6,9,13,.82); border: 1px solid #1C2633; padding: 12px 28px 14px; border-radius: 16px; }
#prog { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: #0F151D; }
#prog i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #2BB57B, var(--pass)); }
#prog u { position: absolute; top: 0; bottom: 0; width: 2px; background: #2A3545; }

.kicker { font: 700 19px/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; color: var(--mute); }
.h1 { font: 800 84px/1.04 var(--sans); letter-spacing: -.028em; }
.h2 { font: 780 58px/1.08 var(--sans); letter-spacing: -.022em; }
.lead { font: 500 30px/1.38 var(--sans); color: var(--soft); }
.mono { font-family: var(--mono); }
.big { font-family: var(--cond); font-weight: 800; line-height: .86; letter-spacing: -.01em; }
.serif { font-family: var(--serif); }
.mint { color: var(--pass); } .amber { color: var(--warn); } .red { color: var(--bad); } .blue { color: var(--info); } .mute { color: var(--mute); } .soft { color: var(--soft); }

.card { background: linear-gradient(180deg, rgba(23,31,43,.94), rgba(14,20,29,.94)); border: 1px solid var(--edge); border-radius: 22px; box-shadow: 0 24px 70px rgba(0,0,0,.45); }
.term { background: #0B1016; border: 1px solid #253244; border-radius: 18px; box-shadow: 0 30px 90px rgba(0,0,0,.55); overflow: hidden; }
.term .bar { height: 46px; display: flex; align-items: center; gap: 10px; padding-left: 20px; border-bottom: 1px solid #1B2430; background: #0E141C; font: 500 17px/1 var(--mono); color: var(--mute); }
.term .bar span { margin-left: 16px; }
.term .d { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
.d.r { background: #FF5F57; } .d.y { background: #FEBC2E; } .d.g { background: #28C840; }
.term .tb { padding: 30px 40px; font-family: var(--mono); color: var(--ink); white-space: pre; }
.pr { color: var(--pass); }

.pill { display: inline-flex; align-items: center; font: 700 16px/1 var(--mono); letter-spacing: .08em; padding: 8px 12px 7px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
.pill.high { color: #FF8A8A; background: rgba(255,93,93,.12); border-color: rgba(255,93,93,.45); }
.pill.med { color: #FFC660; background: rgba(255,176,32,.10); border-color: rgba(255,176,32,.42); }
.pill.ok { color: var(--pass); background: rgba(61,220,151,.10); border-color: rgba(61,220,151,.42); }
.pill.info { color: var(--info); background: rgba(92,200,255,.10); border-color: rgba(92,200,255,.42); }
.stamp { position: absolute; font: 900 25px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; padding: 11px 16px 9px; border: 4px solid; border-radius: 10px; white-space: nowrap; background: rgba(8,11,16,.6); }
.stamp.ok { color: var(--pass); border-color: var(--pass); }
.stamp.no { color: #FF7A7A; border-color: #FF7A7A; }
.stamp.info { color: var(--info); border-color: var(--info); }
.stamp.warn { color: var(--warn); border-color: var(--warn); }
.xpill { font: 600 27px/1 var(--mono); color: #FF8A8A; padding: 17px 24px; border: 1.5px solid rgba(255,93,93,.5); border-radius: 14px; background: rgba(255,93,93,.08); white-space: nowrap; }

.logo * { fill: none; stroke: var(--pass); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 1; }
.logo .lg-pin { stroke: #2E9F70; }

/* scene-specific */
.chip { display: flex; align-items: center; justify-content: center; text-align: center; height: 96px; border-radius: 16px; border: 1px solid var(--edge); background: rgba(20,28,39,.9); font: 700 27px/1.1 var(--sans); }
.row { display: flex; align-items: center; height: 58px; border-bottom: 1px solid var(--line); font: 500 27px/1 var(--sans); }
.row .n { width: 76px; font: 600 21px/1 var(--mono); color: var(--dim); }
.row .tx { flex: 1; }
.tag { padding: 22px 26px; border-radius: 16px; border: 1.5px solid rgba(255,93,93,.45); background: rgba(255,93,93,.07); font: 650 27px/1.25 var(--sans); color: #FFB3B3; }
.layer { height: 66px; border-radius: 14px; border: 1px solid var(--edge); background: linear-gradient(90deg, rgba(27,37,51,.96), rgba(17,24,34,.96)); display: flex; align-items: center; padding-left: 30px; font: 700 28px/1 var(--sans); overflow: hidden; }
.layer::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: var(--c); }
.layer small { font: 600 17px/1 var(--mono); color: var(--mute); margin-left: 16px; letter-spacing: .04em; }
.ann { display: flex; align-items: center; height: 66px; font: 500 26px/1.2 var(--sans); color: var(--soft); }
.ann i { display: inline-block; width: 60px; height: 2px; background: #2B394C; margin-right: 22px; position: relative; flex: none; }
.ann i::after { content: ""; position: absolute; right: -4px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--pass); }
.ticket { height: 112px; border-radius: 16px; border: 1px solid var(--edge); background: rgba(19,26,37,.95); padding: 18px 26px; }
.ticket .t1 { display: flex; align-items: center; gap: 16px; font: 700 27px/1.15 var(--sans); }
.ticket .t2 { font: 500 21px/1.3 var(--sans); color: var(--mute); margin-top: 10px; }
.node { width: 270px; height: 60px; margin-left: -135px; margin-top: -30px; border-radius: 999px; border: 1.5px solid #2A3A4E; background: #0F1620; display: flex; align-items: center; justify-content: center; gap: 12px; font: 650 24px/1 var(--sans); color: var(--soft); }
.node b { font: 700 18px/1 var(--mono); color: var(--dim); }
.claim { height: 98px; border-bottom: 1px solid var(--line); }
.claim .q { font: 600 27px/1.2 var(--sans); }
.claim .w { font: 500 21px/1.3 var(--sans); color: var(--mute); margin-top: 8px; }
.ticks { display: flex; gap: 6px; height: 14px; }
.ticks i { flex: 1; border-radius: 3px; background: #1E2836; }
.tile { width: 540px; height: 300px; padding: 22px 28px; }
.tile .tt { font: 750 30px/1 var(--sans); display: flex; align-items: center; gap: 14px; }
.tile .k { font: 700 15px/1 var(--sans); letter-spacing: .22em; margin-top: 16px; }
.tile .bf { font: 500 21px/1.3 var(--sans); color: var(--mute); margin-top: 7px; white-space: nowrap; }
.tile .af { font: 600 22px/1.32 var(--sans); color: var(--ink); margin-top: 7px; }
.tile .m { position: absolute; left: 28px; bottom: 20px; }
.check { height: 92px; display: flex; align-items: center; gap: 28px; border-bottom: 1px solid var(--line); }
.check .bx { width: 34px; height: 34px; border-radius: 8px; border: 3px solid var(--warn); flex: none; }
.check .ct { font: 700 31px/1.15 var(--sans); }
.check .cs { font: 500 21px/1.3 var(--sans); color: var(--mute); margin-top: 6px; }
.habit { width: 820px; height: 170px; display: flex; gap: 26px; }
.habit .num { width: 104px; font-family: var(--cond); font-weight: 800; font-size: 118px; line-height: .9; color: rgba(61,220,151,.75); text-align: right; flex: none; }
.habit .ht { font: 750 36px/1.15 var(--sans); margin-top: 14px; }
.habit .hs { font: 500 23px/1.35 var(--sans); color: var(--mute); margin-top: 10px; }
.stat { height: 100px; padding: 18px 24px; border-radius: 16px; }
.stat .a { font: 750 31px/1.1 var(--sans); }
.stat .b { font: 500 19px/1.3 var(--sans); color: var(--mute); margin-top: 8px; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="glow"></div>
<div id="vig"></div>
<div id="stage"></div>
<div id="hud">
  <div class="wm"><svg width="30" height="30" viewBox="0 0 200 200" class="logo" style="stroke-dasharray:none"><rect x="50" y="50" width="100" height="100" rx="16" style="stroke-dasharray:none;stroke-width:12"/><path style="stroke-dasharray:none;stroke-width:12" d="M100 70L125 80V100C125 116 114 126 100 131C86 126 75 116 75 100V80Z"/><path style="stroke-dasharray:none;stroke-width:10;stroke:#2E9F70" d="M66 50V28M100 50V28M134 50V28M66 150V172M100 150V172M134 150V172M50 66H28M50 100H28M50 134H28M150 66H172M150 100H172M150 134H172"/></svg>SECURE GPU STACK</div>
  <div class="ch"><b></b><span></span></div>
</div>
<div id="cap"><span></span></div>
<div id="prog"><i></i></div>

<script src="script.js"></script>
<script src="build/timeline.js"></script>
<script>
// ---------- toolkit: everything is a pure function of time t ----------
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: (p) => p,
  out: (p) => 1 - Math.pow(1 - p, 3),
  inOut: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  back: (p) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
};
// Progress of a tween that starts at t0 and lasts d.
const P = (t, t0, d = 0.6, e = E.out) => e(clamp((t - t0) / d));
// Visible from a, gone by b.
const W = (t, a, b, fi = 0.55, fo = 0.45) => Math.min(P(t, a, fi), 1 - P(t, b, fo, E.inOut));
function vis(el, p, { x = 0, y = 26, s = 1 } = {}) {
  el.style.opacity = p;
  el.style.transform = p >= 1 ? '' : `translate(${(1 - p) * x}px, ${(1 - p) * y}px) scale(${s + (1 - s) * p})`;
}
function stamp(el, p, rot = -7) {
  el.style.opacity = clamp(p * 3);
  el.style.transform = `rotate(${rot}deg) scale(${p <= 0 ? 1.8 : lerp(1.8, 1, E.back(p))})`;
}
const fmt = (n) => Math.round(n).toLocaleString('en-US');
function h(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
// Place an element absolutely in a scene, hidden until a tween shows it.
function A(root, x, y, html, w, show = false) {
  const e = h(html);
  e.style.position = 'absolute';
  e.style.left = x + 'px';
  e.style.top = y + 'px';
  if (w) e.style.width = w + 'px';
  e.style.opacity = show ? 1 : 0;
  root.appendChild(e);
  return e;
}
const LOGO = (size) => `<svg viewBox="0 0 200 200" width="${size}" height="${size}" class="logo">
  <rect class="lg-body" x="50" y="50" width="100" height="100" rx="16" pathLength="1"/>
  <path class="lg-pin" pathLength="1" d="M66 50V28M83 50V28M100 50V28M117 50V28M134 50V28M66 150V172M83 150V172M100 150V172M117 150V172M134 150V172M50 66H28M50 83H28M50 100H28M50 117H28M50 134H28M150 66H172M150 83H172M150 100H172M150 117H172M150 134H172"/>
  <path class="lg-shield" pathLength="1" d="M100 70L125 80V100C125 116 114 126 100 131C86 126 75 116 75 100V80Z"/>
  <path class="lg-check" pathLength="1" d="M88 101L97 110L113 92"/>
</svg>`;
function drawLogo(svg, t, t0) {
  const parts = [['.lg-body', 0, 1.0], ['.lg-pin', 0.4, 1.0], ['.lg-shield', 0.8, 0.9], ['.lg-check', 1.4, 0.5]];
  for (const [sel, d0, d] of parts) svg.querySelector(sel).style.strokeDashoffset = 1 - P(t, t0 + d0, d, E.inOut);
}
const head = (R, kicker, title, kc = '') => [
  A(R, 120, 168, `<div class="kicker ${kc}">${kicker}</div>`),
  A(R, 120, 204, `<div class="h2">${title}</div>`, 1680),
];

// ---------- scenes ----------
const SCN = {};
const def = (id, glow, build) => (SCN[id] = { glow, build });

def('cold', [255, 93, 93], (R, S) => {
  const T = A(R, 210, 330, `<div class="term" style="height:250px"><div class="bar"><i class="d r"></i><i class="d y"></i><i class="d g"></i><span>ubuntu@gpu-node: ~</span></div><div class="tb" style="font-size:30px"><span class="pr">$ </span><span class="c1"></span><span class="c2" style="border-radius:6px"></span><span class="cur" style="background:var(--ink)"> </span></div></div>`, 1500);
  const c1 = T.querySelector('.c1'), c2 = T.querySelector('.c2'), cur = T.querySelector('.cur');
  const s1 = 'wget -nv -O- https://lambdalabs.com/install-lambda-stack.sh ', s2 = '| sh -';
  const anno = A(R, 1010, 600, `<div class="mono red" style="font-size:24px;text-align:right">↑ piped into a shell · it calls sudo · root</div>`, 700);
  const kick = A(R, 0, 690, `<div class="kicker" style="text-align:center">Checked before it runs as root</div>`, 1920);
  const row = A(R, 0, 738, `<div style="display:flex;gap:26px;justify-content:center"></div>`, 1920, true);
  const pills = ['no checksum', 'no signature', 'dpkg -i: no signature check'].map((x) => { const p = h(`<div class="xpill">✗ ${x}</div>`); row.appendChild(p); p.style.opacity = 0; return p; });
  return (t) => {
    vis(T, P(t, 0.1, 0.6));
    const n = s1.length + s2.length, k = Math.round(n * P(t, 0.5, 2.7, E.lin));
    c1.textContent = s1.slice(0, Math.min(k, s1.length));
    c2.textContent = k > s1.length ? s2.slice(0, k - s1.length) : '';
    cur.style.opacity = (t > 0.5 && t < 3.3) || Math.floor(t * 1.8) % 2 === 0 ? 1 : 0;
    const hp = P(t, S.L[1] + 0.9, 0.5);
    c2.style.background = `rgba(255,93,93,${0.22 * hp})`;
    c2.style.boxShadow = `0 0 0 4px rgba(255,93,93,${0.9 * hp})`;
    c2.style.color = hp > 0.5 ? '#FFD0D0' : '';
    vis(anno, P(t, S.L[1] + 1.4, 0.5), { y: -12 });
    vis(kick, P(t, S.L[2] - 0.2, 0.5));
    pills.forEach((p, i) => vis(p, P(t, S.L[2] + 0.15 + i * 0.35, 0.45, E.back), { y: 18 }));
  };
});

def('title', [61, 220, 151], (R, S) => {
  const L = A(R, 850, 170, `<div>${LOGO(220)}</div>`, 220, true);
  const svg = L.querySelector('svg');
  const ttl = A(R, 0, 440, `<div style="text-align:center;font:800 132px/1 var(--sans);letter-spacing:-.035em">Secure GPU Stack</div>`, 1920);
  const sub = A(R, 0, 616, `<div style="display:flex;justify-content:center;gap:34px;font:600 38px/1 var(--sans);color:var(--soft)"><span>The same tools as Lambda Stack</span><span class="mint">·</span><span>Safe defaults</span><span class="mint">·</span><span>Proof</span></div>`, 1920, true);
  const parts = [...sub.children];
  const foot = A(R, 0, 720, `<div class="mono" style="text-align:center;font-size:22px;color:var(--mute);letter-spacing:.04em">v0.1 · what I built, what I tested, and how I worked</div>`, 1920);
  return (t) => {
    drawLogo(svg, t, 0.15);
    svg.style.filter = `drop-shadow(0 0 ${24 * P(t, 1.6, 1)}px rgba(61,220,151,.45))`;
    vis(ttl, P(t, S.L[0] - 0.1, 0.8), { y: 30 });
    const at = [0, 0.4, 1.4, 1.9, 2.9];
    parts.forEach((p, i) => vis(p, P(t, S.L[1] + at[i], 0.5), { y: 14 }));
    vis(foot, P(t, S.E[1] - 0.6, 0.6));
  };
});

def('brief', [92, 200, 255], (R, S) => {
  const endA = S.L[4] - 0.3;
  const k1 = A(R, 120, 196, `<div class="kicker">The challenge</div>`);
  const h1 = A(R, 120, 240, `<div class="h1">An alternative to Lambda Stack, <span class="mint">with security built&nbsp;in.</span></div>`, 860);
  const k2 = A(R, 1060, 196, `<div class="kicker">Lambda Stack, in one install</div>`);
  const names = ['NVIDIA driver', 'CUDA', 'cuDNN', 'NCCL', 'PyTorch', 'TensorFlow', 'JAX', 'JupyterLab', 'Docker'];
  const chips = names.map((n, i) => A(R, 1060 + (i % 3) * 252, 240 + Math.floor(i / 3) * 112, `<div class="chip">${n}</div>`, 236));
  const k3 = A(R, 1060, 590, `<div class="mono mute" style="font-size:21px">Ubuntu · one script · updates through apt</div>`);
  const planA = A(R, 120, 560, `<div class="card" style="height:132px;padding:26px 32px"><div class="kicker">Plan A</div><div style="font:700 36px/1.2 var(--sans);margin-top:14px;position:relative;display:inline-block">A locked-down, inference-only appliance<i class="strike" style="position:absolute;left:-6px;top:52%;height:5px;border-radius:3px;background:var(--bad);width:0"></i></div></div>`, 860);
  const strike = planA.querySelector('.strike');
  const fb = A(R, 120, 716, `<div class="card" style="height:132px;padding:26px 32px;border-color:rgba(255,176,32,.55)"><div class="kicker amber">Feedback</div><div style="font:600 32px/1.25 var(--sans);margin-top:14px">“Make it similar to Lambda Stack — an alternative to it.”</div></div>`, 860);
  const [qk, qh] = head(R, 'Before any code', 'The questions that change the design');
  const Q = [
    ['Who uses it?', 'People already renting GPUs on Lambda'],
    ["What's in it?", 'Everything Lambda Stack has'],
    ['How does it ship?', 'The same way: one command'],
    ['How strict can defaults be?', 'An SSH tunnel to Jupyter is fine'],
  ];
  const cards = Q.map(([q, a], i) => A(R, 120 + (i % 2) * 880, 336 + Math.floor(i / 2) * 272,
    `<div class="card" style="height:246px;padding:34px 40px"><div class="mono mint" style="font-size:22px;font-weight:700">Q${i + 1}</div><div style="font:750 44px/1.1 var(--sans);margin-top:16px">${q}</div><div class="ans" style="display:flex;align-items:center;gap:16px;margin-top:26px;font:600 32px/1.2 var(--sans);color:var(--soft)"><span class="mint" style="font-size:34px">✓</span>${a}</div></div>`, 800));
  const ans = cards.map((c) => c.querySelector('.ans'));
  return (t) => {
    vis(k1, W(t, 0.1, endA)); vis(h1, W(t, 0.25, endA), { y: 34 });
    vis(k2, W(t, S.L[1] - 0.3, endA));
    const step = (S.E[1] - S.L[1]) / 10;
    chips.forEach((c, i) => vis(c, W(t, S.L[1] + i * step, endA, 0.45), { y: 20, s: 0.94 }));
    vis(k3, W(t, S.E[1] - 0.6, endA));
    vis(planA, W(t, S.L[2], endA));
    strike.style.width = `calc(${100 * P(t, S.L[3] - 0.1, 0.7, E.inOut)}% + 12px)`;
    if (P(t, S.L[3] - 0.1, 0.01) === 0) strike.style.width = '0';
    planA.style.filter = `saturate(${1 - 0.8 * P(t, S.L[3], 0.6)})`;
    planA.style.opacity = Math.min(+planA.style.opacity, 1 - 0.45 * P(t, S.L[3] + 0.3, 0.6));
    vis(fb, W(t, S.L[3] + 0.5, endA));
    vis(qk, P(t, S.L[4] + 0.1)); vis(qh, P(t, S.L[4] + 0.2), { y: 30 });
    cards.forEach((c, i) => vis(c, P(t, S.L[4] + 0.6 + i * 0.25, 0.6), { y: 30 }));
    const ansAt = [S.w(5, 'People'), S.w(6, 'Everything'), S.w(7, 'The same way'), S.L[8] + 0.6];
    ans.forEach((a, i) => vis(a, P(t, ansAt[i], 0.5), { x: -16, y: 0 }));
  };
});

def('audit', [255, 93, 93], (R, S) => {
  const endA = S.L[1] - 0.3, endB = S.L[4] - 0.3;

    ['02', 'Default driver branch (R570) is end of life', 'high'],

    ['04', 'NVIDIA Container Toolkit predates a High-rated CVE fix', 'high'],
    ['05', 'Package repository is HTTP-only; its metadata never expires', 'med'],
    ['06', 'One signing key is trusted for every repository on the machine', 'med'],
    ['07', 'The install chain verifies nothing before running as root', 'med'],
    ['09', "Ubuntu's user-namespace restriction, bypassable with aa-exec", 'med'],
    ['13', 'Cloud metadata reachable by every user and container', 'med'],

  // B: the pin
  const [bk, bh] = head(R, 'Finding 01', 'The pin that outranks security updates', 'red');
  const track = A(R, 200, 320, `<div style="width:14px;height:540px;border-radius:7px;background:#16202C;overflow:hidden"><i style="position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#2a3a4e,#FF5D5D);border-radius:7px"></i></div>`, 14, true);

  const cardBad = A(R, 1000, 544, `<div class="card" style="height:200px;padding:26px 34px;border-color:rgba(255,93,93,.5)"><div class="kicker red">Installed · held by the pin</div><div class="mono" style="font:700 62px/1 var(--mono);margin-top:18px">580.105.08</div><div class="soft" style="font-size:23px;margin-top:16px">Older than all three 2026 R580 security releases</div></div>`, 800);
  const apt = A(R, 1000, 776, `<div class="mono" style="font-size:28px"><span class="pr">$</span> sudo apt upgrade <span class="red">→ stays on 580.105.08</span></div>`, 800);
  // C: stale
  const [ck, ch] = head(R, 'Findings 02 · 03', 'End of life, and known to be vulnerable', 'red');

  const eol = A(R, 500, 478, `<div class="stamp no" style="position:static;font-size:30px">End of life</div>`);

  const tag = A(R, 0, 590, `<div style="text-align:center;font:600 40px/1 var(--sans);color:var(--soft)">The same tools. Safe defaults. Proof.</div>`, 1920);
  const nxt = A(R, 0, 690, `<div class="mono amber" style="text-align:center;font-size:27px">Next stop: a real Lambda instance →</div>`, 1920);
  return (t) => {
    const out = P(t, S.L[0] - 1.1, 0.6, E.inOut);
    vis(T, P(t, 0.1, 0.5)); T.style.opacity *= 1 - out; T.style.transform = `scale(${1 - 0.04 * out})`;
    const s = 'sudo sgs-check --gpu-test';
    cmd.textContent = s.slice(0, Math.round(s.length * P(t, 0.4, 1.1, E.lin)));
    lns.forEach((l, i) => (l.style.opacity = P(t, 1.8 + i * 0.14, 0.1)));
    res.style.opacity = P(t, 1.8 + lines.length * 0.14 + 0.25, 0.2);
    svg.style.opacity = out;
    drawLogo(svg, t, S.L[0] - 0.6);
    svg.style.filter = `drop-shadow(0 0 ${22 * P(t, S.L[0] + 1.2, 1)}px rgba(61,220,151,.45))`;
    vis(ttl, P(t, S.L[0] + 0.2, 0.8), { y: 30 });
    vis(tag, P(t, S.L[0] + 1.4, 0.7), { y: 20 });
    vis(nxt, P(t, S.L[1], 0.6), { y: 16 });
    document.getElementById('stage').style.opacity = 1 - P(t, S.dur - 1.6, 1.4, E.inOut);
  };
});

// ---------- engine ----------
const TL = globalThis.TIMELINE;
window.DURATION = TL.duration;
window.FPS = TL.fps;
const stageEl = document.getElementById('stage');
const glow = document.getElementById('glow');
const capEl = document.querySelector('#cap span');
const hudEl = document.getElementById('hud');
const chB = document.querySelector('#hud .ch b'), chS = document.querySelector('#hud .ch span');
const progI = document.querySelector('#prog i');
let chapterNo = 0;
const live = TL.scenes.map((sc) => {
  const root = document.createElement('div');
  root.className = 'scene';
  root.style.display = 'none';
  stageEl.appendChild(root);
  const S = { dur: sc.dur, L: sc.lines.map((l) => l.start), E: sc.lines.map((l) => l.start + l.dur), T: sc.lines.map((l) => l.text) };
  // Roughly when a phrase is spoken inside line i, by its position in the text.
  S.w = (i, phrase) => {
    const k = S.T[i].indexOf(phrase);
    if (k < 0) throw new Error(`${sc.id}: "${phrase}" not in line ${i}`);
    return S.L[i] + ((S.E[i] - S.L[i]) * k) / S.T[i].length;
  };
  const def = SCN[sc.id];
  const update = def.build(root, S);
  const no = sc.chapter ? ++chapterNo : 0;
  return { sc, root, S, update, glow: def.glow, no };
});
for (const x of live) if (x.no) { const u = document.createElement('u'); u.style.left = (100 * x.sc.start / TL.duration) + '%'; document.getElementById('prog').appendChild(u); }

let shown = -1;
window.seek = function (t) {
  let i = live.findIndex((x) => t >= x.sc.start && t < x.sc.start + x.sc.dur);
  if (i < 0) i = t < 0 ? 0 : live.length - 1;
  const x = live[i];
  if (i !== shown) { live.forEach((y, j) => (y.root.style.display = j === i ? 'block' : 'none')); shown = i; }
  const lt = t - x.sc.start;
  const f = clamp(Math.min(lt / 0.45, (x.sc.dur - lt) / 0.45));
  x.root.style.opacity = f;
  if (x.sc.id !== 'outro') stageEl.style.opacity = 1;
  x.update(lt);

  const [r, g, b] = x.glow;
  const gx = 960 + 380 * Math.sin(t * 0.11 + i), gy = 520 + 180 * Math.cos(t * 0.09 + i * 1.7);
  glow.style.left = gx - 800 + 'px'; glow.style.top = gy - 800 + 'px';
  glow.style.background = `radial-gradient(closest-side, rgba(${r},${g},${b},${0.13 * f}), rgba(${r},${g},${b},0))`;

  hudEl.style.opacity = x.no ? f : 0;
  if (x.no) { chB.textContent = String(x.no).padStart(2, '0'); chS.textContent = x.sc.chapter; }
  progI.style.width = (100 * t / TL.duration) + '%';

  let cap = '';
  let cp = 0;
  for (const l of x.sc.lines) {
    if (lt >= l.start - 0.05 && lt < l.start + l.dur + 0.3) { cap = l.text; cp = Math.min(P(lt, l.start - 0.05, 0.15), 1 - P(lt, l.start + l.dur + 0.15, 0.15)); }
  }
  capEl.textContent = cap;
  capEl.parentElement.style.opacity = cap ? cp : 0;
};
const q = new URLSearchParams(location.search);
window.seek(q.has('t') ? +q.get('t') : 0);
</script>
