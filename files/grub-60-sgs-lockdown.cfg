# Secure GPU Stack: kernel lockdown in integrity mode, on machines without
# Secure Boot (which turns it on by itself). Even root then can't load an
# unsigned kernel module, write kernel memory (/dev/mem) or kexec an unsigned
# kernel: the ways a rootkit gets into the kernel. Ubuntu's kernel modules and
# its prebuilt NVIDIA modules are signed. install.sh leaves this out when DKMS
# modules are installed, since those are unsigned. sgs-check checks it.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT lockdown=integrity"
