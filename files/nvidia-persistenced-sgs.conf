# Secure GPU Stack: the GPU device files are for the video group only, and
# nvidia-persistenced drops root with setgid + setuid and no initgroups, so
# its account's groups don't count. Groups the process starts with do.
#
# Its control socket is 0777, so any account could talk to a daemon that holds
# the video group's GPU access. Only root's nvidia-smi -pm and GPU containers
# use it, and containers get the socket mounted in, past this folder. So the
# folder is closed to accounts outside video (Lambda A100, both images).
[Service]
SupplementaryGroups=video
# "-": a missing folder mustn't stop the daemon (sgs-check reports it open).
ExecStartPost=-+/bin/chgrp video /run/nvidia-persistenced
ExecStartPost=-+/bin/chmod 0750 /run/nvidia-persistenced
