# Secure GPU Stack: persistence mode, as NVIDIA recommends for data-center GPUs.
# Ubuntu's unit starts the daemon with --no-persistence-mode, so the driver
# tears the GPU down whenever no program has it open. On a Lambda A100 every
# CUDA program then spent 3.4-3.9 s starting up and nvidia-smi 2 s, against
# 0.18 s and 26 ms with persistence mode. GPU memory is still cleared between
# processes (tests/gpu-memory-test.py, same A100). install.sh leaves it out on
# machines with a battery, where it would keep the GPU from powering down.
[Service]
ExecStart=
ExecStart=/usr/bin/nvidia-persistenced --user nvidia-persistenced --verbose
