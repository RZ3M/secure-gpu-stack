# Secure GPU Stack: GPU performance counters are for administrators only.
# They can leak what other processes on the GPU are doing (CVE-2018-6260, a
# side channel). The driver already defaults to this; pinning it stops a
# profiling guide's `=0` from turning it off unnoticed. Nsight Compute and
# CUPTI metrics then need sudo. sgs-check verifies it.
options nvidia NVreg_RestrictProfilingToAdminUsers=1

# GPU device files for the video group only. Whenever root uses the GPU
# (nvidia-smi as root does), the driver's library recreates /dev/nvidia* with
# these settings; the default is 0666, open to every local user and service
# account (verified on krabs). install.sh writes the system's video gid here.
options nvidia NVreg_DeviceFileUID=0 NVreg_DeviceFileGID=44 NVreg_DeviceFileMode=0660
