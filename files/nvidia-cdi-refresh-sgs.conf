# Secure GPU Stack: nvidia-cdi-refresh recreates the GPU device files
# (nvidia-ctk system create-device-nodes) whenever the driver loads. Limit them
# to the video group and lock them again afterwards, even if the refresh
# failed. "+" runs it outside the unit's CapabilityBoundingSet, which lacks
# CAP_CHOWN.
[Service]
ExecStopPost=+/usr/local/sbin/sgs-gpu-devices
