# Secure GPU Stack: kernel settings that don't get in the way of ML work.
# Ubuntu 24.04 already defaults to most of these. Pinning them here means a
# package or a tuning guide can't loosen them unnoticed: a later sysctl file
# can still override this one, but sgs-check reads the live values daily.
#
# Trade-offs, on purpose:
# - dmesg_restrict hides kernel messages, including GPU Xid errors, from normal
#   users. Read them with `sudo dmesg`.
# - ptrace_scope 1 still lets you attach a debugger or py-spy to your own child
#   processes; attaching to any other process needs sudo.
# - perf_event_paranoid isn't pinned: Ubuntu's default (4) stays, and Nsight
#   Systems CPU sampling needs `sudo nsys` or a temporary lower value.

# Kernel addresses stay out of /proc for normal users (helps against exploits).
kernel.kptr_restrict = 1
kernel.dmesg_restrict = 1
# Only root can load BPF programs, a common kernel exploit path.
kernel.unprivileged_bpf_disabled = 2
# Only root can use io_uring, the fast I/O interface behind most kernel
# exploits in Google's kCTF program (Google turned it off on its servers).
# Ubuntu's default lets everyone. Nothing in the stack needs it (checked on
# krabs: QEMU's tools and an opt-in cuFile mode are the only users). To let a
# group use it, set kernel.io_uring_group to its gid in a later sysctl file.
kernel.io_uring_disabled = 1
# Unprivileged user namespaces, which expose kernel code that's otherwise
# root-only and are part of many privilege-escalation exploits, stay limited
# to programs whose AppArmor profile allows them (Ubuntu's default, which
# rootless-container and Electron guides tell people to turn off). Ubuntu
# leaves a known way around it open: an ordinary user can switch into any of
# those profiles with aa-exec (Qualys, 2025). On krabs that gave a normal user
# uid 0 in a new namespace; with the second setting it fails, and programs
# that get their profile when they start, Chrome or rootless Docker, still
# work. "-": skipped quietly on a kernel without AppArmor's settings.
-kernel.apparmor_restrict_unprivileged_userns = 1
-kernel.apparmor_restrict_unprivileged_unconfined = 1
# Only root can load terminal line-discipline modules. Ubuntu's 6.8 kernel
# lets any user load them (on the test VM, an ordinary user loaded ppp_async
# and slip); n_hdlc and n_gsm bugs have given local root before. Nothing in an
# ML stack attaches one. The settings from here on are strictest at 0.
dev.tty.ldisc_autoload = 0
# Setuid programs (sudo, mount, pkexec...) never dump core. The kernel already
# writes any core file mode 0600 to the crashing user, so a normal crash can't
# leak one user's model weights or tokens to another (verified on the VM: a
# second user read a token out of a planted core 0 times). This closes the
# narrower case where a setuid program's core could hold privileged memory.
# Nothing in an ML stack needs a setuid program to dump. (Ubuntu defaults to 2,
# "root-only"; 0 is stricter and standard server hardening.)
fs.suid_dumpable = 0
# No ICMP redirects: another machine on the network can't reroute this one's
# traffic, and this one doesn't tell others to. (The Ubuntu cloud image
# accepts them.) For every interface, not just "all": IPv4 sends a redirect
# if all or the interface says so, and IPv6 reads only the interface (seen on
# the VM: enp0s1 still sent and accepted them). systemd-sysctl applies the
# globs at boot, and its udev rule applies them to each new interface.
net.ipv4.conf.*.accept_redirects = 0
net.ipv6.conf.*.accept_redirects = 0
net.ipv4.conf.*.send_redirects = 0
kernel.yama.ptrace_scope = 1
# Links and pipes in shared directories like /tmp can't be used to trick
# root-owned processes.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 1
fs.protected_regular = 2
