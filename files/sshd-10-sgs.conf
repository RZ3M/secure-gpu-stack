# Secure GPU Stack: SSH accepts keys only, and never root.
# Files in sshd_config.d are read in name order and the first value set wins,
# so "10-" takes precedence over the "50-"/"60-" files Ubuntu ships.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
# OpenSSH's default. Lower values lock out people whose ssh-agent offers
# several keys before the right one ("Too many authentication failures").
MaxAuthTries 6
# No X11 forwarding (Ubuntu's sshd_config turns it on): a compromised server
# can't reach the screen or keystrokes of someone connected with ssh -X.
X11Forwarding no
# OpenSSH's defaults minus SHA-1 and 64-bit MACs, and no RSA keys under 2048
# bits (install.sh checks the user has a key that still works first).
MACs -*sha1*,umac-64*
RequiredRSASize 2048
# One key file: authorized_keys2 is deprecated, and one more place a key can
# be planted unnoticed.
AuthorizedKeysFile .ssh/authorized_keys
# The banner doesn't name the OS release (OpenSSH's own version stays).
DebianBanner no
# Close connections whose client has gone away (15 minutes); idle sessions
# that still answer stay open.
ClientAliveInterval 300
ClientAliveCountMax 3
